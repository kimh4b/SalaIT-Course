
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course</title>
</head>
<body>

    <nav>
        <a href="/HTML Lesson/index.html">Home</a>
        <a href="/HTML Lesson/teacher.html">Teachers</a>
        <a href="/HTML Lesson/teacher-form.html">Add Teacher</a>
        <a href="/HTML Lesson/course-form.html">Add Course</a>
    </nav>

    <h1>Course Registration</h1>

    <form action="index.html" method="get">

        <label for="courseCode">Course Code</label>
        <input
            type="text"
            id="courseCode"
            name="courseCode"
            pattern="[A-Z]{2}[0-9]{3}"
            placeholder="WD101"
            title="Example: WD101"
            required
        >

        <br><br>

        <label for="courseName">Course Name</label>
        <input
            type="text"
            id="courseName"
            name="courseName"
            minlength="3"
            maxlength="100"
            required
        >

        <br><br>

        <label for="credits">Credits</label>
        <input
            type="number"
            id="credits"
            name="credits"
            min="1"
            max="6"
            required
        >

        <br><br>

        <label for="description">Description</label>
        <textarea
            id="description"
            name="description"
            maxlength="200"
        ></textarea>

        <br><br>

        <button type="submit">Create Course</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
